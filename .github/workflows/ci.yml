name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:web
      - run: pnpm typecheck:web
      - run: pnpm test:web
      - run: pnpm build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy services packages ml
      - run: uv run pytest
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code packages/contracts/openapi.json

  e2e:
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @recovery-os/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            apps/web/e2e/playwright-report
            apps/web/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  service-e2e:
    runs-on: ubuntu-latest
    needs: [web, python, e2e]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --all-groups
      - run: pnpm --filter @recovery-os/web exec playwright install --with-deps chromium
      - run: pnpm e2e:service
      - name: Upload service Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-playwright-diagnostics
          path: |
            playwright-report/service-stack
            test-results/service-stack
          if-no-files-found: ignore
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --all-groups
      - run: uv tool install pip-audit==2.10.1
      - run: uv run python scripts/security/scan_repository.py
      - run: uv run python scripts/deployment/check_migrations.py
      - run: bash scripts/security/scan-dependencies.sh
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  containers:
    runs-on: ubuntu-24.04-arm
    needs: [web, python, e2e, service-e2e, security]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API
        run: docker build -f services/api/Dockerfile -t recovery-os-api:test .
      - name: Build worker
        run: docker build -f services/worker/Dockerfile -t recovery-os-worker:test .
      - name: Build customer agent
        run: docker build -f services/customer-agent/Dockerfile -t recovery-os-customer-agent:test .
