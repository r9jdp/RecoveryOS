name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:web
      - run: pnpm typecheck:web
      - run: pnpm test:web
      - run: pnpm build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy services packages ml
      - run: uv run pytest
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code packages/contracts/openapi.json

  containers:
    runs-on: ubuntu-24.04-arm
    needs: [web, python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API
        run: docker build -f services/api/Dockerfile -t recovery-os-api:test .
      - name: Build worker
        run: docker build -f services/worker/Dockerfile -t recovery-os-worker:test .
      - name: Build customer agent
        run: docker build -f services/customer-agent/Dockerfile -t recovery-os-customer-agent:test .

