name: Hosted release validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recoveryos-release-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --all-groups
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @recovery-os/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: uv tool install pip-audit==2.10.1
      - run: uv run python scripts/security/scan_repository.py --browser-dir apps/web/.next/static
      - run: uv run python scripts/deployment/check_migrations.py
      - run: bash scripts/security/scan-dependencies.sh
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
