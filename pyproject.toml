[project]
name = "recovery-os"
version = "0.1.0"
description = "Auditable revenue recovery orchestration for failed subscriptions"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=46,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "orjson>=3.11,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "structlog>=25.4,<26",
  "temporalio>=1.17,<2",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1"
]
ml = [
  "catboost>=1.2,<2",
  "pandas>=2.3,<3",
  "scikit-learn>=1.7,<2"
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["services", "packages", "ml", "tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["apps/web", ".venv"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "packages", "ml"]
