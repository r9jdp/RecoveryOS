services:
  api:
    environment:
      APP_ENV: staging
      OPERATOR_AUTH_REQUIRED: "true"
      OPERATOR_COOKIE_SECURE: "true"
      OPERATOR_COOKIE_SAMESITE: none
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.75"
          pids: 256
  worker:
    environment:
      APP_ENV: staging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.00"
          pids: 256
  customer-agent:
    environment:
      APP_ENV: staging
      CUSTOMER_AGENT_TASK_STORE: sql
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"
          pids: 192
  edge-gateway:
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
          pids: 64
