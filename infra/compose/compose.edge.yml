name: recoveryos-edge

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      - ${CADDY_ENV_FILE:?Set CADDY_ENV_FILE to the protected Caddy environment file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - edge
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
    name: recoveryos-edge

volumes:
  caddy_data:
  caddy_config:
