global
    log stdout format raw local0
    maxconn 256

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option http-buffer-request
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout queue 5s

backend api_all_rates
    stick-table type ip size 100k expire 10m store http_req_rate(1m)

backend api_mutation_rates
    stick-table type ip size 100k expire 10m store http_req_rate(1m)

backend agent_all_rates
    stick-table type ip size 100k expire 10m store http_req_rate(1m)

backend agent_mutation_rates
    stick-table type ip size 100k expire 10m store http_req_rate(1m)

frontend recovery_api
    bind :8000
    acl mutating_method method POST PUT PATCH DELETE
    http-request track-sc0 hdr_ip(X-Forwarded-For,-1) table api_all_rates
    http-request track-sc1 hdr_ip(X-Forwarded-For,-1) table api_mutation_rates if mutating_method
    http-request deny deny_status 413 if { req.body_size gt 1048576 }
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 240 }
    http-request deny deny_status 429 if mutating_method { sc_http_req_rate(1) gt 60 }
    http-response set-header Retry-After 60 if { status 429 }
    default_backend recovery_api_upstream

frontend customer_agent
    bind :8010
    acl mutating_method method POST PUT PATCH DELETE
    http-request track-sc0 hdr_ip(X-Forwarded-For,-1) table agent_all_rates
    http-request track-sc1 hdr_ip(X-Forwarded-For,-1) table agent_mutation_rates if mutating_method
    http-request deny deny_status 413 if { req.body_size gt 1048576 }
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 120 }
    http-request deny deny_status 429 if mutating_method { sc_http_req_rate(1) gt 30 }
    http-response set-header Retry-After 60 if { status 429 }
    default_backend customer_agent_upstream

backend recovery_api_upstream
    option httpchk GET /health/live
    http-check expect status 200
    server api api:8000 check inter 5s fall 3 rise 2 init-addr libc,none

backend customer_agent_upstream
    option httpchk GET /health/live
    http-check expect status 200
    server customer-agent customer-agent:8010 check inter 5s fall 3 rise 2 init-addr libc,none
