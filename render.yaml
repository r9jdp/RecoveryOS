projects:
  - name: RecoveryOS
    environments:
      - name: production
        services:
          - type: web
            name: recoveryos-api
            runtime: python
            plan: free
            buildCommand: uv sync --frozen --no-dev --group ml
            startCommand: uv run --no-sync alembic -c services/api/alembic.ini upgrade head && uv run --no-sync uvicorn services.api.app.main:app --host 0.0.0.0 --port $PORT
            healthCheckPath: /health/ready
            envVars:
              - key: PYTHON_VERSION
                value: 3.12.11
              - key: APP_ENV
                value: production
              - key: DEMO_MODE
                value: "false"
              - key: SERVICE_NAME
                value: recoveryos-api
              - key: APP_VERSION
                value: render
              - key: WEB_ORIGIN
                value: http://localhost:3000
              - key: HEALTHCHECK_TIMEOUT_SECONDS
                value: "8"
              - key: OPERATOR_AUTH_REQUIRED
                value: "false"
              - key: OPERATOR_COOKIE_SECURE
                value: "true"
              - key: OPERATOR_COOKIE_SAMESITE
                value: none
              - key: OPERATOR_SESSION_SECRET
                generateValue: true
              - key: PAYMENT_PROVIDER
                value: razorpay
              - key: RECOVERY_ACTIVITY_MODE
                value: production
              - key: RECOVERY_ALLOW_REAL_PAYMENT_ACTIONS
                value: "true"
              - key: RECOVERY_EMBEDDED_WORKER
                value: "true"
              - key: RECOVERY_GLOBAL_KILL_SWITCH
                value: "false"
              - key: RAZORPAY_API_BASE_URL
                value: https://api.razorpay.com
              - key: RAZORPAY_CHECKOUT_ORIGIN
                value: http://localhost:3000
              - key: RAZORPAY_OUTBOX_POLL_SECONDS
                value: "0.5"
              - key: RAZORPAY_TEST_MODE_REQUIRED
                value: "true"
              - key: RECOVERYBENCH_ARTIFACT_DIR
                value: ml/recoverybench/artifacts/recoverybench.v1
              - key: RECOVERY_MODEL_REQUIRED
                value: "true"
              - key: TEMPORAL_TASK_QUEUE
                value: recovery-os
              - key: TEMPORAL_TLS
                value: "true"
              - key: A2A_ENABLED
                value: "false"
              - key: VOICE_PROVIDER
                value: mock
              - key: VOICE_REAL_CALLS_ENABLED
                value: "false"
              - key: DATABASE_URL
                sync: false
              - key: TEMPORAL_ADDRESS
                sync: false
              - key: TEMPORAL_NAMESPACE
                sync: false
              - key: TEMPORAL_API_KEY
                sync: false
              - key: RAZORPAY_KEY_ID
                sync: false
              - key: RAZORPAY_KEY_SECRET
                sync: false
              - key: RAZORPAY_WEBHOOK_SECRET
                sync: false
              - key: RECOVERY_MERCHANT_ID
                sync: false
              - key: RECOVERY_MERCHANT_DISPLAY_NAME
                sync: false
              - key: RECOVERY_MERCHANT_EXTERNAL_ID
                sync: false
              - key: RECOVERY_MERCHANT_TIMEZONE
                value: Asia/Kolkata
              - key: RECOVERY_MERCHANT_CURRENCY
                value: INR
              - key: OPERATOR_DEMO_EMAIL
                sync: false
              - key: OPERATOR_DEMO_TOKEN
                sync: false

          - type: web
            name: recoveryos-customer-agent
            runtime: python
            plan: free
            buildCommand: uv sync --frozen --no-dev
            startCommand: uv run --no-sync uvicorn app.main:app --app-dir services/customer-agent --host 0.0.0.0 --port $PORT
            healthCheckPath: /health/ready
            envVars:
              - key: PYTHON_VERSION
                value: 3.12.11
              - key: CUSTOMER_AGENT_TASK_STORE
                value: sql
              - key: CUSTOMER_AGENT_REQUEST_TTL_SECONDS
                value: "900"
              - key: CUSTOMER_AGENT_RECEIPT_VERIFICATION_MODE
                value: pinned
              - key: LLM_PROVIDER
                value: openai
              - key: CUSTOMER_AGENT_ORIGIN
                sync: false
              - key: CUSTOMER_AGENT_WEB_ORIGIN
                sync: false
              - key: CUSTOMER_AGENT_SIGNER_KEY_ID
                sync: false
              - key: CUSTOMER_AGENT_ED25519_PRIVATE_KEY
                sync: false
              - key: CUSTOMER_AGENT_REAL_SIGNING_ENABLED
                value: "true"
              - key: CUSTOMER_AGENT_DATABASE_URL
                fromService:
                  type: web
                  name: recoveryos-api
                  envVarKey: DATABASE_URL
              - key: CUSTOMER_AGENT_RECOVERY_AGENT_PUBLIC_KEYS_JSON
                sync: false
              - key: OPENAI_API_KEY
                sync: false
              - key: OPENAI_MODEL
                sync: false
