services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: recovery_os
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: recovery
    ports:
      - "${RECOVERYOS_SERVICE_POSTGRES_PORT}:5432"
    volumes:
      - service-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery -d recovery_os"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.29.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: recovery
      POSTGRES_PWD: recovery
      POSTGRES_SEEDS: postgres
    ports:
      - "${RECOVERYOS_SERVICE_TEMPORAL_PORT}:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  service-postgres-data:
